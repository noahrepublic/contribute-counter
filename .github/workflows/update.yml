name: Counter updater

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Count contributions and lines
      run: node index.js
      env:
        # Personal access token so private and org repos are counted.
        # Without it, only public repos are counted.
        COUNTER_TOKEN: ${{ secrets.COUNTER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Commit and push
      if: always()
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add contributions.txt linesWrote.txt updated.txt
        git diff --cached --quiet || git commit -m "Updated counter"
        git push
